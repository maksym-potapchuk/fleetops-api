name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-lint:
    name: "Backend · Ruff lint & format"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install "ruff>=0.15.1,<0.16.0"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  backend-test:
    name: "Backend · Django tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_fleet_db
          POSTGRES_USER: fleet_user
          POSTGRES_PASSWORD: fleet_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      POSTGRES_DB: test_fleet_db
      POSTGRES_USER: fleet_user
      POSTGRES_PASSWORD: fleet_pass
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "1"
      ALLOWED_HOSTS: "*"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install "poetry>=2.3.0,<3.0.0"

      - name: Configure Poetry
        run: poetry config virtualenvs.create false

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: pip-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run migrations
        run: python manage.py migrate --settings=config.test_settings

      - name: Run tests
        run: python manage.py test --settings=config.test_settings --verbosity=2 --noinput

  frontend-lint:
    name: "Frontend · ESLint & TypeScript"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

  frontend-test:
    name: "Frontend · Vitest"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  build:
    name: "Docker · Build images"
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-test]

    steps:
      - uses: actions/checkout@v6

      - name: Build backend image
        run: docker build backend/

      - name: Build frontend prod image
        run: docker build -f frontend/Dockerfile.prod frontend/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: cd-production
      cancel-in-progress: false

    env:
      SSH_CMD: ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
      PROJECT_DIR: ~/Fleet-Managment-System
      COMPOSE: docker compose -f docker-compose.prod.yml

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Backup database
        run: |
          $SSH_CMD "cd $PROJECT_DIR && $COMPOSE exec -T backend python manage.py db_dump"
          $SSH_CMD "cd $PROJECT_DIR/backups && ls -t *.json 2>/dev/null | tail -n +6 | xargs -r rm"

      - name: Pull latest code
        run: |
          $SSH_CMD "cd $PROJECT_DIR && git fetch origin main && git reset --hard origin/main"

      - name: Build new images
        run: |
          $SSH_CMD "cd $PROJECT_DIR && $COMPOSE build"
        timeout-minutes: 15

      - name: Dry-run migrations
        run: |
          PLAN=$($SSH_CMD "cd $PROJECT_DIR && $COMPOSE run --rm -T backend python manage.py showmigrations --plan" | grep '\[ \]' || true)
          if [ -n "$PLAN" ]; then
            echo "Pending migrations:"
            echo "$PLAN"
          else
            echo "No pending migrations"
          fi

      - name: Deploy
        run: |
          $SSH_CMD "cd $PROJECT_DIR && $COMPOSE up -d --force-recreate"

      - name: Healthcheck
        run: |
          sleep 20
          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            HTTP_CODE=$($SSH_CMD "curl -s -o /dev/null -w '%{http_code}' http://localhost/api/v1/auth/me/" || echo "000")
            if [ "$HTTP_CODE" != "000" ]; then
              echo "Healthy (HTTP $HTTP_CODE)"
              break
            fi
            if [ "$i" -eq "$RETRIES" ]; then
              echo "FATAL: Not responding after $RETRIES attempts"
              exit 1
            fi
            echo "Waiting... (attempt $i/$RETRIES)"
            sleep 10
          done
          $SSH_CMD "cd $PROJECT_DIR && $COMPOSE ps"
          echo "=== Deploy successful ==="

      - name: Cleanup Docker
        run: |
          $SSH_CMD "docker image prune -f"
          $SSH_CMD "docker builder prune -f --keep-storage=2GB"
          FREED=$($SSH_CMD "docker system df --format '{{.Reclaimable}}'" | head -1)
          echo "Dangling images and old build cache removed"

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh/deploy_key
